   <script>
    //function expression

   {

        };

    //callback function
  function ask(question, yes, no) {
  if (confirm(question)) yes();
  else no();
}

function agree() {
  alert("You agreed");
}

function cancel() {
  alert("You cancelled");
}

ask("Do you agree?", agree, cancel);
