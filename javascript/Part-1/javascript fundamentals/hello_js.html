<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body style="background-color: aqua;">
    <p>Before script run</p>

    "use strict"; 
    <!--  now "use strict"; is a welcome guest at the top of your scripts. Later, when your code is all in classes and modules, you may omit it-->

    <script>
        alert('hello javascript !!!');
    </script><!--The <script> tag contains JavaScript code which is automatically executed when the browser processes the tag.-->
        <script src="java_script.js"></script> <!--External  script Add to html-->
     <p>External js file is runned</p>

    <p>If src is set, the script content is ignored Example</p>
     <!-- 
     <script src="file.js">
        alert(1); // the content is ignored,because src is set  
      </script>
      -->

      <script src="java_script.js"></script>
      <script>
            alert(1);
       </script> 
       <p>script end.!!!</p>

</body>
</html>
