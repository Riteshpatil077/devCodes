 <script>
    // GENARATOR SYMBOL ITERATOR

    let range = {
        from: 1,to:5,

        async *[Symbol.asyncIterator]()
        {
            for(let value = this.from; value <= this.to; value++)
                {
                    await new Promise(resolve => setTimeout(resolve,2000));

                    yield value;
                }
            
        }
    };
    (async() => {
        for await (let value of range)
        {
            alert(value);
        }
    })();
 </script>
