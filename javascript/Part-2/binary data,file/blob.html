        alert("from Blob to Arraybuffer Example");
        (async function() {
            const uint8Array = new Uint8Array([72, 101, 108, 108, 111]); // 'Hello'
            const blob = new Blob([uint8Array], { type: 'text/plain' }); // create a blob
            const bufferPromise = await blob.arrayBuffer(); // get arraybuffer from blob
            alert(new TextDecoder().decode(bufferPromise)); // decode and alert the content
        })();
