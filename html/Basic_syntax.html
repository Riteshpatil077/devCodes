<!DOCTYPE html> <!--Tells the browser: “This document is HTML5 ,Helps browser render the page correctly -->

<html lang="en"><!--Root element of the HTML page
lang="en" means language = English-->

<head>
    <meta charset="UTF-8"><!--Supports all characters (A-Z, a-z, emojis, symbols, Hindi, etc.)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Makes website responsive
Important for mobile view
width=device-width → fit to screen width
initial-scale=1.0 → normal zoom level-->

    <title>HTML_Syntax</title> <!--Sets the title of the webpage 
    Shown in:
    Browser tab
    Google search results-->
</head>
<body> <!-- visible part of body in html-->

    <p>My cat is very grumpy</p> <!-- p for paragraph-->
    <!-- <>This opening tag marks where the element begins or starts to take effect. 
     </>Failing to include a closing tag is a common beginner error that can produce peculiar results -->

     
</body>
</html> <!--closing tag-->
